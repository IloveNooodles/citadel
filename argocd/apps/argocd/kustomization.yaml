apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - projects/infra.yaml
  - projects/keda.yaml
  - projects/prometheus.yaml
  - servicemonitor/servicemonitor.yaml
  - routing/httproute.yaml
  - config-map/argocd-cmd-params-cm.yaml

patches:
  - target:
      kind: ConfigMap
      name: argocd-cm
    path: config-map/argocd-cm.yaml
  - target:
      kind: ConfigMap
      name: argocd-rbac-cm
    path: rbac/argocd-rbac-cm.yaml
